# Builds Claybroom for Windows (.exe), macOS (.dmg) and Linux (.tar.gz).
# Push a tag like v0.1.0 to attach all three to a GitHub release, or run it by hand
# (Actions › release › Run workflow) to download them as build artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries for the window
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Tests (includes the rules check against mechanics.json)
        run: cargo test

      - name: Windows .exe
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/claybroom.exe "dist/Claybroom-${GITHUB_REF_NAME}-windows-x64.exe"

      - name: macOS .dmg
        if: matrix.name == 'macos'
        run: sh packaging/macos-dmg.sh

      - name: Linux .tar.gz
        if: matrix.name == 'linux'
        run: |
          cargo build --release
          mkdir -p dist/claybroom
          cp target/release/claybroom README.md LICENSE dist/claybroom/
          tar -czf "dist/Claybroom-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C dist claybroom

      - uses: actions/upload-artifact@v4
        with:
          name: claybroom-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
